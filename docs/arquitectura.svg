<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t{font-size:14px;fill:#1E1E1E}
    .h{font-size:15px;font-weight:700;fill:#1E1E1E}
    .s{font-size:12px;fill:#555}
    .box{fill:#fff;stroke:#3a3a3a;stroke-width:1.5}
    .y{fill:#F2B705;stroke:#3a3a3a;stroke-width:1.5}
    .g{fill:#F3F3F1;stroke:#3a3a3a;stroke-width:1.5}
    .ar{stroke:#3a3a3a;stroke-width:1.8;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a3a3a"/></marker></defs>
  <rect width="1000" height="620" fill="#fff"/>
  <text x="500" y="30" text-anchor="middle" class="h" style="font-size:18px">Figuras Lima: arquitectura</text>

  <!-- Columna 1: fuentes -->
  <text x="130" y="62" text-anchor="middle" class="s">1. FUENTES DE DATOS</text>
  <rect class="g" x="20" y="72" width="220" height="64" rx="6"/><text x="130" y="98" text-anchor="middle" class="h">Legendsverse</text><text x="130" y="118" text-anchor="middle" class="s">catálogo, BAF, retail, valor EE. UU.</text>
  <rect class="g" x="20" y="150" width="220" height="64" rx="6"/><text x="130" y="176" text-anchor="middle" class="h">Tiendas peruanas</text><text x="130" y="196" text-anchor="middle" class="s">Falabella, Plaza Vea, Oechsle, Tai Loy</text>
  <rect class="g" x="20" y="228" width="220" height="64" rx="6"/><text x="130" y="254" text-anchor="middle" class="h">Wayback Machine</text><text x="130" y="274" text-anchor="middle" class="s">Tai Loy, Seven, Toys Master, ML 2010-11</text>
  <rect class="g" x="20" y="306" width="220" height="64" rx="6"/><text x="130" y="332" text-anchor="middle" class="h">Avisos transcritos</text><text x="130" y="352" text-anchor="middle" class="s">Marketplace y eBay (anonimizados)</text>
  <rect class="g" x="20" y="384" width="220" height="64" rx="6"/><text x="130" y="410" text-anchor="middle" class="h">Importaciones (agregado)</text><text x="130" y="430" text-anchor="middle" class="s">FOB por unidad, partida 9503</text>

  <!-- Columna 2: procesamiento -->
  <text x="500" y="62" text-anchor="middle" class="s">2. PROCESAMIENTO (backend/)</text>
  <rect class="box" x="340" y="72" width="320" height="64" rx="6"/><text x="500" y="98" text-anchor="middle" class="h">consolidar.py: cruce y limpieza</text><text x="500" y="118" text-anchor="middle" class="s">nombre + año → observaciones_precios.csv</text>
  <rect class="box" x="340" y="168" width="320" height="64" rx="6"/><text x="500" y="194" text-anchor="middle" class="h">matching.py / figuras.py / waves.py</text><text x="500" y="214" text-anchor="middle" class="s">búsqueda por figura o BAF, sobreprecio por canal</text>
  <rect class="box" x="340" y="264" width="320" height="64" rx="6"/><text x="500" y="290" text-anchor="middle" class="h">estimacion.py</text><text x="500" y="310" text-anchor="middle" class="s">precio justo estimado (ridge + covariables)</text>
  <rect class="box" x="340" y="360" width="320" height="64" rx="6"/><text x="500" y="386" text-anchor="middle" class="h">passthrough.py + delivery.py</text><text x="500" y="406" text-anchor="middle" class="s">pass-through de precios; envío y tiempo (haversine)</text>

  <!-- Columna 3: IA -->
  <text x="870" y="62" text-anchor="middle" class="s">3. IA (ai/)</text>
  <rect class="y" x="760" y="72" width="220" height="64" rx="6"/><text x="870" y="98" text-anchor="middle" class="h">Whisper (local)</text><text x="870" y="118" text-anchor="middle" class="s">voz a texto, faster-whisper</text>
  <rect class="y" x="760" y="150" width="220" height="64" rx="6"/><text x="870" y="176" text-anchor="middle" class="h">Claude o reglas</text><text x="870" y="196" text-anchor="middle" class="s">pedido → búsqueda estructurada</text>

  <!-- App -->
  <rect class="y" x="340" y="470" width="320" height="76" rx="6"/>
  <text x="500" y="498" text-anchor="middle" class="h">App Streamlit (5 pestañas)</text>
  <text x="500" y="518" text-anchor="middle" class="s">Buscar figura · Armar un BAF · Wave/línea</text>
  <text x="500" y="535" text-anchor="middle" class="s">Serie histórica · Soy vendedor</text>
  <rect class="box" x="740" y="480" width="240" height="56" rx="6"/><text x="860" y="505" text-anchor="middle" class="h">Streamlit Community Cloud</text><text x="860" y="523" text-anchor="middle" class="s">URL pública</text>
  <rect class="box" x="20" y="480" width="220" height="56" rx="6"/><text x="130" y="505" text-anchor="middle" class="h">Usuario (Lima)</text><text x="130" y="523" text-anchor="middle" class="s">coleccionista o vendedor</text>

  <!-- Flechas -->
  <path class="ar" d="M240 104 L340 104"/>
  <path class="ar" d="M240 182 L300 182 L300 110 L340 110"/>
  <path class="ar" d="M240 260 L300 260 L300 116 L340 116"/>
  <path class="ar" d="M240 338 L300 338 L300 120 L340 120"/>
  <path class="ar" d="M240 416 L320 416 L320 392 L340 392"/>
  <path class="ar" d="M500 136 L500 168"/>
  <path class="ar" d="M500 232 L500 264"/>
  <path class="ar" d="M500 328 L500 360"/>
  <path class="ar" d="M500 424 L500 470"/>
  <path class="ar" d="M870 136 L870 150"/>
  <path class="ar" d="M870 214 L870 450 L660 490"/>
  <path class="ar" d="M240 508 L340 508"/>
  <path class="ar" d="M660 508 L740 508"/>
  <path class="ar" d="M860 480 L860 456 L660 456 L660 470" stroke-dasharray="4 4"/>
  <text x="500" y="590" text-anchor="middle" class="s">El usuario habla o escribe; la IA lo convierte en una búsqueda; el backend cruza las fuentes y la app muestra precio, historial, plan de compra y mapa.</text>
</svg>
